server.port=8080
server.error.include-message=always
# H2 file database (zero setup). Data is kept in ./data/courier.mv.db
spring.datasource.url=jdbc:h2:file:./data/courier;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# To use MySQL instead: replace the datasource lines with
# spring.datasource.url=jdbc:mysql://localhost:3306/courier
# spring.datasource.username=root / spring.datasource.password=...   (and add the mysql-connector-j dependency)
